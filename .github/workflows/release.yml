name: Build and Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Resolve release version
        id: version
        shell: pwsh
        run: |
          [xml]$project = Get-Content -LiteralPath "DeskPing.csproj"
          $version = [string]$project.Project.PropertyGroup.Version
          if ([string]::IsNullOrWhiteSpace($version)) {
            throw "Version is missing from DeskPing.csproj."
          }

          $tag = "v$version.${{ github.run_number }}"
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT

      - name: Publish self-contained Windows app
        shell: pwsh
        run: |
          dotnet publish "DeskPing.csproj" `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:EnableCompressionInSingleFile=true `
            -p:DebugType=None `
            -p:DebugSymbols=false `
            -o publish

      - name: Package release
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path release -Force | Out-Null
          $asset = "release/DeskPing-${{ steps.version.outputs.tag }}-win-x64.zip"
          Compress-Archive -Path publish\* -DestinationPath $asset -Force

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: DeskPing-${{ steps.version.outputs.tag }}-win-x64
          path: release/*.zip
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: DeskPing ${{ steps.version.outputs.tag }}
          files: release/*.zip
          generate_release_notes: true
          make_latest: true